<button
  type="button"
  class="group text-left bg-white border border-slate-200 rounded-xl p-4 hover:border-slate-400 hover:shadow-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-600 focus-visible:ring-offset-2 transition flex flex-col gap-3 min-h-[176px]"
  hx-get="/detail/{{ r.id }}?date={{ snapshot_date }}"
  hx-target="#detail-panel"
  hx-swap="innerHTML"
  aria-label="Recommendation {{ rank }}: {{ r.name }}"
>
  <div class="flex items-start justify-between gap-3">
    <div class="text-xs font-semibold text-slate-500 tabular-nums leading-none">#{{ rank }}</div>
    <span class="inline-flex items-center gap-1 bg-brand-50 text-brand-700 text-xs font-semibold px-2 py-0.5 rounded-full tabular-nums">
      {{ r.score }}
    </span>
  </div>

  <div class="flex-1">
    <div class="text-sm font-medium text-slate-900 line-clamp-2 leading-snug">{{ r.name }}</div>
    <div class="text-xs text-slate-500 mt-1 line-clamp-1">
      {{ r.brand or 'Unknown brand' }}
      {% set srcs = r.sources or [r.source] %}
      · {{ srcs | join(', ') }}
    </div>
  </div>

  <div class="flex items-center justify-between">
    <div class="text-base font-semibold text-slate-900 tabular-nums">
      {% if r.price %}${{ '%.2f' % r.price }}{% else %}<span class="text-slate-300">—</span>{% endif %}
    </div>
    {% if r.signal == 'bestseller' %}
      <span class="text-[11px] font-medium text-slate-600">Bestseller</span>
    {% elif r.signal == 'high_rated' %}
      <span class="text-[11px] font-medium text-slate-600">Top Rated</span>
    {% endif %}
  </div>
</button>
