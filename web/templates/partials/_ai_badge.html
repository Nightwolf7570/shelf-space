{# AI substitute-aware verdict chip. Renders nothing when AI is disabled. #}
{% macro ai_badge(status) %}
{%- if status == 'true_gap' -%}
<span class="text-[11px] font-semibold text-brand-700 bg-brand-50 px-2 py-0.5 rounded">True gap</span>
{%- elif status == 'brand_gap' -%}
<span class="text-[11px] font-semibold text-amber-800 bg-amber-50 px-2 py-0.5 rounded">Brand gap</span>
{%- elif status == 'covered' -%}
<span class="text-[11px] font-semibold text-slate-500 bg-slate-100 px-2 py-0.5 rounded">Covered</span>
{%- endif -%}
{% endmacro %}
